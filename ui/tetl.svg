<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#34404A" flood-opacity="0.24"/>
    </filter>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1C2228" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="focusLift" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip">
      <rect width="1024" height="1024" rx="230"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="#DDE3EA" filter="url(#tileShadow)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#focusLift)" clip-path="url(#tileClip)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="222"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3"/>

  <g fill="#FF2D8A" filter="url(#markShadow)">
    <rect x="196" y="248" width="632" height="152" rx="44"/>
    <rect x="282" y="450" width="152" height="336" rx="38"/>
    <rect x="590" y="450" width="152" height="336" rx="38"/>
  </g>
</svg>